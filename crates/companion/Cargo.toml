[package]
name = "keyside-companion"
description = "Keyside companion: serves the deck to paired devices and runs actions on the PC."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "keyside"
path = "src/lib.rs"

[[bin]]
name = "keyside"
path = "src/main.rs"

[features]
default = ["hardware", "input", "sound", "midi", "focus", "nowplaying", "appaudio"]
hardware = ["dep:elgato-streamdeck", "render"]
render = ["dep:image", "dep:resvg", "dep:ab_glyph"]
# Track and cover from any media player (MPRIS on Linux, media controls on Windows).
nowplaying = ["dep:image", "dep:zbus", "dep:windows"]
# Per-app volume and mute on Windows. Linux uses pactl and needs nothing extra.
appaudio = ["dep:windows"]
# Keys, text and media keys. Wayland desktops use the virtual keyboard protocol.
input = ["dep:enigo", "dep:wayland-client", "dep:wayland-protocols-misc"]
sound = ["dep:rodio"]
midi = ["dep:midir"]
focus = ["dep:active-win-pos-rs"]

[dependencies]
aes-gcm = "0.11"
anyhow = "1"
argon2 = "0.6"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
directories = "6"
ed25519-dalek = "3"
flate2 = "1"
futures-util = "0.3"
hkdf = "0.13"
hmac = "0.13"
if-addrs = "0.15"
keyring = "4"
mdns-sd = "0.21"
open = "5"
p256 = { version = "0.14", features = ["ecdh"] }
parking_lot = "0.12"
rand = "0.10"
rcgen = "0.14"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rosc = "0.11"
rust-embed = "8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
sha2 = "0.11"
subtle = "2"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.7", features = ["set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }

ab_glyph = { version = "0.2", optional = true }
active-win-pos-rs = { version = "0.11", optional = true }
elgato-streamdeck = { version = "0.14", optional = true, features = ["async"] }
enigo = { version = "0.6", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "webp"] }
midir = { version = "0.11", optional = true }
resvg = { version = "0.49", optional = true }
rodio = { version = "0.23", optional = true, default-features = false, features = ["playback", "mp3", "wav", "vorbis", "flac"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-protocols-misc = { version = "0.3", optional = true, features = ["client"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Media_Control",
    "Foundation",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
] }

[lints.clippy]
# axum handlers return full responses as errors, and the device link holds a session inline.
result_large_err = "allow"
large_enum_variant = "allow"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
