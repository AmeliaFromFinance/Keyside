[package]
name = "phonedeck-companion"
description = "PhoneDeck companion: serves the deck to paired devices and runs actions on the PC."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "phonedeck"
path = "src/lib.rs"

[[bin]]
name = "phonedeck"
path = "src/main.rs"

[features]
default = ["hardware", "input", "sound", "midi", "focus"]
hardware = ["dep:elgato-streamdeck", "dep:image", "dep:resvg", "dep:ab_glyph"]
input = ["dep:enigo"]
sound = ["dep:rodio"]
midi = ["dep:midir"]
focus = ["dep:active-win-pos-rs"]

[dependencies]
aes-gcm = "0.11"
anyhow = "1"
argon2 = "0.6"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
directories = "6"
ed25519-dalek = "3"
flate2 = "1"
futures-util = "0.3"
hkdf = "0.13"
hmac = "0.13"
if-addrs = "0.15"
keyring = "4"
mdns-sd = "0.21"
open = "5"
p256 = { version = "0.14", features = ["ecdh"] }
parking_lot = "0.12"
rand = "0.10"
rcgen = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rosc = "0.11"
rust-embed = "8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.7", features = ["set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }

ab_glyph = { version = "0.2", optional = true }
active-win-pos-rs = { version = "0.11", optional = true }
elgato-streamdeck = { version = "0.14", optional = true, features = ["async"] }
enigo = { version = "0.6", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "webp"] }
midir = { version = "0.11", optional = true }
resvg = { version = "0.49", optional = true }
rodio = { version = "0.23", optional = true, default-features = false, features = ["playback", "symphonia-mp3", "symphonia-wav", "symphonia-vorbis"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
