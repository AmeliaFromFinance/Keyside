<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}} · Keyside</title>
    <meta name="theme-color" content="#121118" />
    <link rel="icon" href="{{base}}/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="{{base}}/site.css" />
  </head>
  <body class="docs">
    <header class="top">
      <a class="brand" href="{{base}}/"><img src="{{base}}/icon.svg" alt="" width="28" height="28" />Keyside</a>
      <nav>
        <a href="{{base}}/docs/plugins/">Docs</a>
        <a href="https://github.com/AmeliaFromFinance/keyside">GitHub</a>
      </nav>
    </header>
    <div class="doc-wrap">
      <nav class="side" aria-label="Documentation">
{{nav}}
      </nav>
      <article class="prose">
        <h1>{{title}}</h1>
{{content}}
        <p class="edit"><a href="{{source}}">Edit this page on GitHub</a></p>
      </article>
    </div>
  </body>
</html>
