name: Release

on:
  push:
    tags: ["v*"]
  # Creates the tag on the chosen commit, for when tags can't be pushed.
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag, like v1.0.0
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # A rebuild starts from a clean draft. Published releases are never touched.
  draft:
    name: Clear old draft
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: |
          for id in $(gh api "repos/${{ github.repository }}/releases" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id"); do
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
          done

  desktop:
    name: Desktop (${{ matrix.target }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libudev-dev libasound2-dev libxdo-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:plugins
      - run: pnpm --filter @keyside/client build
      - run: node scripts/stage-plugins.ts apps/desktop/src-tauri/resources/plugins
      - name: Plugin runtime
        shell: bash
        run: |
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          node scripts/fetch-deno.ts ${{ matrix.target }} "apps/desktop/src-tauri/binaries/deno-${{ matrix.target }}$ext"
      - name: Release notes
        shell: bash
        run: |
          v="${TAG#v}"
          {
            echo "NOTES<<EOF"
            awk -v v="$v" '/^## \[/{on = index($0, "[" v "]") > 0; next} on' CHANGELOG.md
            echo
            echo "### Installing"
            echo
            echo "- **Windows:** the installer isn't code-signed yet. If SmartScreen warns, choose *More info* then *Run anyway*."
            echo "- **macOS:** the app isn't notarized yet. If macOS blocks the first launch, open *System Settings → Privacy & Security* and choose *Open Anyway*."
            echo "- **Linux:** use the AppImage, or the .deb or .rpm package."
            echo "EOF"
          } >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ env.TAG }}
          releaseName: Keyside ${{ env.TAG }}
          releaseBody: ${{ env.NOTES }}
          releaseDraft: true
          prerelease: false

  android:
    name: Android
    # After the desktop builds, so both upload into the same draft.
    needs: desktop
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @keyside/client build
      - run: pnpm --filter @keyside/mobile exec cap sync android
      - name: Build APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease
      - name: Sign APK
        if: env.ANDROID_KEYSTORE != ''
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > release.keystore
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/zipalign" -p 4 apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk Keyside.apk
          "$tools/apksigner" sign --ks release.keystore --ks-pass env:ANDROID_KEYSTORE_PASSWORD Keyside.apk
          rm release.keystore
      - uses: softprops/action-gh-release@v3
        if: env.ANDROID_KEYSTORE != ''
        with:
          draft: true
          tag_name: ${{ env.TAG }}
          files: Keyside.apk
