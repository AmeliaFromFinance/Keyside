name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libudev-dev libasound2-dev libxdo-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:plugins
      - run: pnpm --filter @phonedeck/client build
      - run: node scripts/stage-plugins.ts apps/desktop/src-tauri/resources/plugins
      - name: Plugin runtime
        shell: bash
        run: |
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          node scripts/fetch-deno.ts ${{ matrix.target }} "apps/desktop/src-tauri/binaries/deno-${{ matrix.target }}$ext"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: PhoneDeck ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false

  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @phonedeck/client build
      - run: pnpm --filter @phonedeck/mobile exec cap sync android
      - name: Build APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease
      - name: Sign APK
        if: env.ANDROID_KEYSTORE != ''
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > release.keystore
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/zipalign" -p 4 apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk PhoneDeck.apk
          "$tools/apksigner" sign --ks release.keystore --ks-pass env:ANDROID_KEYSTORE_PASSWORD PhoneDeck.apk
          rm release.keystore
      - uses: softprops/action-gh-release@v2
        if: env.ANDROID_KEYSTORE != ''
        with:
          draft: true
          files: PhoneDeck.apk
