[workspace]
resolver = "3"
members = ["crates/companion"]
default-members = ["crates/companion"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/OWNER/phonedeck"
rust-version = "1.85"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
