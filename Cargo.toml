[workspace]
resolver = "3"
members = ["crates/companion"]
default-members = ["crates/companion"]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "1.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/AmeliaFromFinance/keyside"
rust-version = "1.88"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
